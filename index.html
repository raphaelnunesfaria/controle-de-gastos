<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

<main class="pagina">

    <!-- CABECALHO + BOTOES DE ARQUIVO -->
    <header class="cabecalho">
        <h1>Controle de Gastos</h1>

        <div class="botoes-arquivo">
            <button type="button" id="botaoExportar" class="botao botao-secundario">Exportar dados</button>
            <label for="campoImportar" class="botao botao-secundario">Importar dados</label>
            <input type="file" id="campoImportar" class="escondido" accept=".json,application/json">
        </div>
    </header>

    <!-- RESUMO: receitas, despesas e saldo -->
    <section class="resumo">
        <div class="cartao">
            <span class="cartao-titulo">Receitas</span>
            <strong id="textoReceitas" class="valor-receita">R$ 0,00</strong>
        </div>
        <div class="cartao">
            <span class="cartao-titulo">Despesas</span>
            <strong id="textoDespesas" class="valor-despesa">R$ 0,00</strong>
        </div>
        <div class="cartao">
            <span class="cartao-titulo">Saldo</span>
            <strong id="textoSaldo">R$ 0,00</strong>
        </div>
    </section>

    <!-- AVISO: sucesso, erro ou alerta (o JS escolhe a classe e tira o "escondido") -->
    <p id="mensagemFeedback" class="feedback escondido" role="status"></p>

    <!-- FORMULARIO: cadastrar e editar
         novalidate = desliga a validacao automatica do navegador,
         a validacao sera feita pelo JavaScript (validarFormulario) -->
    <section id="painelFormulario" class="painel">
        <h2 id="tituloFormulario">Novo lançamento</h2>

        <form id="formularioLancamento" class="formulario" novalidate>
            <div class="campo campo-largo">
                <label for="campoDescricao">Descrição</label>
                <input type="text" id="campoDescricao">
                <span id="erroDescricao" class="erro-campo escondido"></span>
            </div>

            <div class="campo">
                <label for="campoValor">Valor (R$)</label>
                <input type="number" id="campoValor" step="0.01">
                <span id="erroValor" class="erro-campo escondido"></span>
            </div>

            <div class="campo">
                <label for="campoData">Data</label>
                <input type="date" id="campoData">
                <span id="erroData" class="erro-campo escondido"></span>
            </div>

            <div class="campo">
                <label for="campoTipo">Tipo</label>
                <select id="campoTipo">
                    <option value="receita">Receita</option>
                    <option value="despesa">Despesa</option>
                </select>
            </div>

            <div class="campo">
                <label for="campoNatureza">Natureza</label>
                <select id="campoNatureza">
                    <option value="fixa">Fixa</option>
                    <option value="variavel">Variável</option>
                </select>
            </div>

            <div class="campo campo-largo">
                <label for="campoCategoria">Categoria</label>
                <input type="text" id="campoCategoria" placeholder="ex: alimentacao, lazer, trabalho">
                <span id="erroCategoria" class="erro-campo escondido"></span>
            </div>

            <div class="linha-botoes">
                <button type="submit" id="botaoSalvarLancamento" class="botao">Cadastrar</button>
                <button type="button" id="botaoCancelarEdicao" class="botao botao-secundario escondido">Cancelar edição</button>
            </div>
        </form>
    </section>

    <!-- LISTA DE LANCAMENTOS + FILTROS -->
    <section class="painel">
        <h2>Lançamentos</h2>

        <div class="barra-filtros">
            <div class="campo-filtro">
                <label for="campoFiltroCategoria">Categoria</label>
                <select id="campoFiltroCategoria">
                    <option value="">Todas</option>
                </select>
            </div>

            <div class="campo-filtro">
                <label for="campoFiltroTipo">Tipo</label>
                <select id="campoFiltroTipo">
                    <option value="">Todos</option>
                    <option value="receita">Receitas</option>
                    <option value="despesa">Despesas</option>
                </select>
            </div>

            <div class="campo-filtro">
                <label for="campoFiltroNatureza">Natureza</label>
                <select id="campoFiltroNatureza">
                    <option value="">Todas</option>
                    <option value="fixa">Fixas</option>
                    <option value="variavel">Variáveis</option>
                </select>
            </div>

            <div class="campo-filtro">
                <label for="campoFiltroMes">Mês</label>
                <input type="month" id="campoFiltroMes">
            </div>

            <button type="button" id="botaoLimparFiltros" class="botao botao-secundario botao-pequeno">Limpar filtros</button>
        </div>

        <p id="textoContagem" class="texto-contagem">0 lançamentos</p>

        <div class="tabela-rolagem">
            <table id="tabelaLancamentos" class="tabela">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Descrição</th>
                        <th>Categoria</th>
                        <th>Tipo</th>
                        <th>Natureza</th>
                        <th>Valor</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="corpoTabela"></tbody>
            </table>
        </div>

        <p id="mensagemVazia" class="mensagem-vazia">Nenhum lançamento cadastrado.</p>
    </section>

</main>

<script src="app.js"></script>
</body>
</html>
